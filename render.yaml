services:
  - type: web
    name: lumia-agent-platform-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run prisma:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.x
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: EXA_API_KEY
        sync: false
      - key: IREMBO_OFFICIAL_URL
        value: https://irembo.gov.rw
